<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061b24"><title>澄境</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="aquarium" aria-label="三维水族馆"></main>
<div class="vignette"></div>
<footer class="controls" aria-label="水族馆控制区域">
<nav class="toolbar" aria-label="水族馆控制">
<button id="pause" aria-label="暂停动画" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
<button id="theme" aria-label="切换光照氛围"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg></button>
<button id="density" aria-label="切换鱼群数量"><svg viewBox="0 0 24 24"><path d="M4 9c4-5 10-5 14 0-4 5-10 5-14 0Zm14 0 4-3v6zM2 17c3-3 7-3 10 0-3 3-7 3-10 0Zm10 0 3-2v4z"/><path d="M7 9h.01"/></svg></button>
<button id="quality" aria-label="切换省电画质" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M19 4C8 3 3 9 6 16c7 3 13-2 13-12ZM4 21l10-11"/></svg></button>
<button id="field-guide" aria-label="打开鱼类图鉴" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1ZM12 5v15M6 8h3M15 8h3"/></svg></button>
<button id="fullscreen" aria-label="全屏沉浸"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
</nav></footer>
<dialog id="catalog" aria-labelledby="catalog-title">
<section class="catalog-shell">
<header class="catalog-header"><div><span class="catalog-eyebrow">STILLWATER FIELD GUIDE</span><h1 id="catalog-title">水下居民图鉴</h1></div><button id="close-catalog" aria-label="关闭图鉴"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header>
<div class="catalog-content"><section class="catalog-detail" aria-live="polite"><div class="catalog-preview" id="catalog-preview" aria-label="可拖动旋转的鱼类模型"><span class="preview-hint">拖动，看看它的另一面</span></div><div class="catalog-copy"><p class="catalog-family" id="species-family"></p><h2 id="species-name"></h2><p class="species-subtitle" id="species-subtitle"></p><p id="species-description"></p><div class="species-features" id="species-features"></div><p class="species-behavior" id="species-behavior"></p></div></section><nav class="species-list" id="species-list" aria-label="选择图鉴鱼种"></nav></div>
<footer class="catalog-footer">澄境原创鱼种 · 共七种<span id="species-count"></span></footer>
</section></dialog>
<div id="loading" role="status" aria-label="正在加载水族馆"><span class="loader-orbit"></span></div>
<script src="vendor/three.min.js"></script><script src="fish-species.js"></script><script src="fish-motion.js"></script><script src="aquarium.js"></script>
</body></html>
