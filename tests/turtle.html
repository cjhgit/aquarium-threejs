<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>澄境 · 海龟模型检查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b222a;color:#d9e0d0;font:14px/1.6 system-ui}header{height:76px;padding:16px 28px;display:flex;align-items:center;gap:24px}h1{font-size:18px;margin:0}button{border:1px solid #64786b;background:#1c3739;color:inherit;padding:7px 15px;border-radius:6px;cursor:pointer}label{display:flex;align-items:center;gap:8px}#views{height:calc(100vh - 155px);position:relative;min-height:550px}canvas{display:block;width:100%;height:100%}.view-label{position:absolute;top:0;left:0;pointer-events:none;color:#9dad9f;letter-spacing:.16em;font-size:12px;padding:18px 28px}.view-label:nth-of-type(2){left:50%}.view-label:nth-of-type(3){top:50%}.view-label:nth-of-type(4){left:50%;top:50%}#result{margin:14px 28px;white-space:pre-wrap;font-size:12px}</style>
<header><h1>橄榄海龟 · 四视图</h1><button id="pause">暂停</button><label>划鳍相位 <input id="phase" type="range" min="0" max="4.6" step=".01" value="0"></label><label><input type="checkbox" id="glide">滑翔</label><button id="check">检查结构与运动</button></header>
<div id="views"><span class="view-label">透视 / THREE QUARTER</span><span class="view-label">背甲 / DORSAL</span><span class="view-label">侧面 / LATERAL</span><span class="view-label">正面 / ANTERIOR</span></div><pre id="result">加载中…</pre>
<script src="../vendor/three.min.js"></script><script src="../turtle.js"></script><script src="turtle-tests.js"></script>
<script>
const T=THREE,host=document.querySelector('#views'),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.setScissorTest(true);host.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#0b222a');scene.add(new T.HemisphereLight(0xe3eddf,0x35494a,2));const sun=new T.DirectionalLight(0xffe9c2,2.5);sun.position.set(2,5,3);scene.add(sun);const rim=new T.DirectionalLight(0x8cbdcb,1.5);rim.position.set(-3,1,-4);scene.add(rim);
const model=AQUARIUM_TURTLE.createModel();scene.add(model);let time=0,paused=false;const cameras=[[1.7,1.5,2.1],[0,3,0],[0,.15,3],[3,.15,0]].map((p,i)=>{const c=new T.OrthographicCamera(-1.4,1.4,1.1,-1.1,.01,20);c.position.fromArray(p);if(i===1)c.up.set(1,0,0);c.lookAt(.03,.01,0);return c;});
function render(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);for(let i=0;i<4;i++){const x=(i%2)*w/2,y=i<2?h/2:0,c=cameras[i];const hh=i===1?1.24:.94;c.left=-hh*w/h;c.right=hh*w/h;c.top=hh;c.bottom=-hh;c.updateProjectionMatrix();renderer.setViewport(x,y,w/2,h/2);renderer.setScissor(x,y,w/2,h/2);renderer.render(scene,c);}}
const phase=document.querySelector('#phase');document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'继续':'暂停';};phase.oninput=()=>{paused=true;document.querySelector('#pause').textContent='继续';time=+phase.value;};
let last=performance.now();function frame(now){if(!paused)time+=(now-last)/1000;last=now;AQUARIUM_TURTLE.animate(model,time,document.querySelector('#glide').checked?1:0);phase.value=time%4.6;render();requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.turtleReview={model,renderer,scene,cameras,setTime(t,glide=0){paused=true;time=t;AQUARIUM_TURTLE.animate(model,t,glide);render();},render};
document.querySelector('#check').onclick=()=>{const r=runTurtleTests();document.querySelector('#result').textContent=r.rows.map(r=>(r.pass?'通过':'失败')+' · '+r.name+(r.detail?'：'+r.detail:'')).join('\n');window.turtleTestResult=r;};document.querySelector('#result').textContent='本页与水族馆、图鉴使用同一模型。支持离线打开。';
</script>
</html>
