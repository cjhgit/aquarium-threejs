<!DOCTYPE html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未来水族馆 · 运动回归检查</title><style>body{max-width:850px;margin:50px auto;padding:0 24px;background:#09212b;color:#c7ded3;font:14px/1.8 system-ui}h1{font-size:22px}button{padding:8px 20px;border:1px solid #8eaa9c;border-radius:6px;background:#15333b;color:inherit;cursor:pointer}li{padding:10px 0;border-bottom:1px solid #b5ccb41c}.fail{color:#f1a88d}pre{font-size:11px;white-space:pre-wrap;color:#89aba5}</style><h1>未来水族馆 · 运动回归检查</h1><p>无需服务器或构建工具，直接打开本页即可检查追食、变速、散开、直立和碰撞。长时间模拟可能需要数秒。</p><button id="run">运行检查</button><p id="summary" role="status"></p><ol id="results"></ol><script src="../vendor/three.min.js"></script><script src="../fish-species.js"></script><script src="../fish-motion.js"></script><script src="../crab-rig.js"></script><script src="../turtle.js"></script><script src="../manta.js"></script><script src="../robot-fish.js"></script><script src="../reef-life.js"></script><script src="motion-tests.js"></script><script>document.querySelector('#run').onclick=async()=>{const button=document.querySelector('#run'),list=document.querySelector('#results'),summary=document.querySelector('#summary');button.disabled=true;list.replaceChildren();summary.textContent='检查中…';const result=await runMotionTests(row=>{const li=document.createElement('li');li.className=row.pass?'':'fail';li.textContent=(row.pass?'通过 · ':'失败 · ')+row.name;if(row.detail){const pre=document.createElement('pre');pre.textContent=typeof row.detail==='string'?row.detail:JSON.stringify(row.detail,null,2);li.append(pre);}list.append(li);});summary.textContent=`${result.passed} 项通过，${result.failed} 项失败`;window.motionTestResult=result;button.disabled=false;};</script></html>
